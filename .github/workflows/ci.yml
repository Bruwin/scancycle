name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --config Debug --parallel 4

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Debug

  # The matrix above builds only the headless half, which left the renderer with no
  # automated execution at all. This job runs it for real against Mesa's lavapipe
  # software device, under Xvfb because SDL3 needs a surface to create.
  vulkan-headless:
    name: vulkan 1.3 (lavapipe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install a software Vulkan device and an X server
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvulkan-dev vulkan-tools vulkan-validationlayers \
            mesa-vulkan-drivers xvfb \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev \
            libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev \
            libdecor-0-dev

      # The renderer's exit code only means something if validation really ran.
      - name: Assert the validation layer is installed
        run: |
          ls /usr/share/vulkan/explicit_layer.d/
          ls /usr/share/vulkan/explicit_layer.d/ | grep -qi khronos_validation \
            || { echo "VK_LAYER_KHRONOS_validation is missing"; exit 1; }

      - name: Configure with the renderer enabled
        run: cmake -S . -B build -DSC_ENABLE_VULKAN=ON -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --parallel 4

      - name: Report the Vulkan device
        run: vulkaninfo --summary

      # The viewer exits non-zero when validation reported an error, so a bad
      # descriptor, barrier or pipeline fails the job instead of drawing garbage.
      - name: Render 90 frames headlessly
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1920x1080x24" ./build/bin/scancycle_viewer \
            --frames 90 --capture render.ppm \
            --compare-with tests/data/scene_reference.ppm --tolerance 6 | tee render.log
          grep -Eq "draws [1-9]" render.log
          grep -Eq "validation errors 0" render.log
          echo "=== capture begin ==="
          base64 -w 100 render.ppm
          echo "=== capture end ==="

